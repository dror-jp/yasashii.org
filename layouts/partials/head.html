<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{- $title := printf "%s — %s" (.Title | replaceRE "《[^》]*》" "") site.Title -}}
{{- if .IsHome }}{{ $title = printf "%s — %s" site.Title site.Params.tagline }}{{ end -}}
<title>{{ $title }}</title>
<meta name="description" content="{{ with .Params.summary }}{{ . | replaceRE "《[^》]*》" "" }}{{ else }}役所の 手続きと 防災の 情報を、やさしい 日本語で 読めます。{{ site.Params.notGovernment }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
