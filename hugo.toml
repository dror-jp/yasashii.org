baseURL = "https://yasashii.org/"
title = "yasashii.org"
languageCode = "ja"
defaultContentLanguage = "ja"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[params]
  tagline = "役所の 情報を、やさしい 日本語で。"
  notGovernment = "ここは 政府や 役所の サイトでは ありません。"
  operatorName = "DroR Corporation"
  operatorUrl = "https://dror.co.jp"

[outputFormats]
  [outputFormats.DocumentsJSON]
    mediaType = "application/json"
    baseName = "documents"
    isPlainText = true
    notAlternative = true
  [outputFormats.TermsJSON]
    mediaType = "application/json"
    baseName = "terms"
    isPlainText = true
    notAlternative = true
  [outputFormats.MetaJSON]
    mediaType = "application/json"
    baseName = "meta"
    isPlainText = true
    notAlternative = true
  [outputFormats.LlmsFull]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true
  [outputFormats.MD]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    notAlternative = true

[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputs]
  home = ["HTML", "LlmsFull", "MD"]
  section = ["HTML", "MD"]
  page = ["HTML", "MD"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[minify]
  disableXML = true
